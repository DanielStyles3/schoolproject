<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — YABATECH Student Result Portal</title>
  <meta name="theme-color" content="#216015">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">

  <main class="auth-card">
    <div class="auth-inner">
      <img class="auth-logo" src="assets/yabatech-logo.png"
           alt="Yaba College of Technology" width="168" height="50">

      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">We will email you a secure reset link</p>

      <form class="auth-form" id="reset-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@yabatech.edu.ng"
                 autocomplete="email" required>
          <p class="field-hint">
            Use the email attached to your account. If you only know your matric
            number, contact the admin office.
          </p>
        </div>

        <p class="field-error hidden" id="err" role="alert"></p>

        <button type="submit" class="btn btn-primary btn-block" id="btn-reset">
          Send reset link
        </button>

        <div class="auth-links" style="justify-content:center">
          <a href="index.html">← Back to sign in</a>
        </div>
      </form>
    </div>

    <div class="auth-footer">
      Powered by the Student Result Management System
    </div>
  </main>

  <div id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    $("#reset-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var err = $("#err");
      hide(err);

      var email = $("#email").value.trim();
      if (!email) { err.textContent = "Enter your email address."; show(err); return; }

      var btn = $("#btn-reset");
      btn.disabled = true;
      btn.textContent = "Sending…";

      var res = await db.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/index.html",
      });

      btn.disabled = false;
      btn.textContent = "Send reset link";

      if (res.error) {
        err.textContent = errMessage(res.error, "Could not send the reset email");
        show(err);
        return;
      }

      // Do not reveal whether the address exists.
      toastOk("If that email is registered, a reset link is on its way.");
      $("#email").value = "";
    });
  </script>
</body>
</html>
