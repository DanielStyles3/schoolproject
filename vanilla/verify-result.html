<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify a result — YABATECH Student Result Portal</title>
  <meta name="theme-color" content="#216015">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body" style="align-items:flex-start;padding-top:40px">

  <main class="auth-card" style="max-width:720px">
    <div class="auth-inner">
      <img class="auth-logo" src="assets/yabatech-logo.png"
           alt="Yaba College of Technology" width="168" height="50">

      <h1 class="auth-title">Verify a result</h1>
      <p class="auth-subtitle">Confirm published results using a matric number</p>

      <form class="auth-form" id="verify-form" novalidate>
        <div class="field">
          <label for="matric">Matric Number</label>
          <input type="text" id="matric" placeholder="D/ND/23/3210359"
                 autocapitalize="characters" required>
        </div>

        <p class="field-error hidden" id="err" role="alert"></p>

        <button type="submit" class="btn btn-primary btn-block" id="btn-verify">
          Verify result
        </button>

        <div class="auth-links" style="justify-content:center">
          <a href="index.html">← Back to sign in</a>
        </div>
      </form>

      <div id="results" class="hidden" style="margin-top:24px"></div>
    </div>

    <div class="auth-footer">
      Only published results are shown. Draft scores remain private.
    </div>
  </main>

  <div id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    $("#verify-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var err = $("#err");
      var out = $("#results");
      hide(err);
      hide(out);

      var matric = $("#matric").value.trim();
      if (!matric) { err.textContent = "Enter a matric number."; show(err); return; }

      var btn = $("#btn-verify");
      btn.disabled = true;
      btn.textContent = "Checking…";

      var res = await db.rpc("verify_published_results", { p_matric: matric });

      btn.disabled = false;
      btn.textContent = "Verify result";

      if (res.error) {
        err.textContent = /function|does not exist|schema cache/i.test(res.error.message || "")
          ? "Result verification is not set up on this database yet. Run vanilla/sql/001_matric_number.sql in the Supabase SQL editor."
          : errMessage(res.error, "Could not verify that matric number");
        show(err);
        return;
      }

      var rows = res.data || [];
      if (!rows.length) {
        err.textContent = "No published result found for that matric number.";
        show(err);
        return;
      }

      var units = rows.reduce(function (s, r) { return s + (Number(r.course_unit) || 0); }, 0);

      out.innerHTML =
        '<div class="alert alert-success"><strong>' + esc(rows[0].student_name) + "</strong>" +
          esc(rows[0].matric_number) + " · " + esc(rows[0].session_name) + "</div>" +
        '<div class="table-wrap"><table class="data">' +
          "<thead><tr><th>Code</th><th>Course</th>" +
          '<th class="center">Units</th><th class="numeric">Total</th>' +
          "<th>Grade</th><th>Remark</th></tr></thead><tbody>" +
          rows.map(function (r) {
            return "<tr><td><strong>" + esc(r.course_code) + "</strong></td>" +
              "<td>" + esc(r.course_title) + "</td>" +
              '<td class="center">' + esc(r.course_unit) + "</td>" +
              '<td class="numeric"><strong>' + esc(r.total_score) + "</strong></td>" +
              '<td><span class="' + gradeBadgeClass(r.grade) + '">' + esc(r.grade) + "</span></td>" +
              "<td>" + esc(r.remark) + "</td></tr>";
          }).join("") +
        "</tbody></table></div>" +
        '<p class="field-hint" style="text-align:center;margin-top:12px">' +
          rows.length + " published course(s), " + units + " units total.</p>";

      show(out);
    });
  </script>
</body>
</html>
